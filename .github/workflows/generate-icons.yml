name: Generate icons with AI
on:
  workflow_dispatch:
    inputs:
      words:
        description: "Icon ideas, comma separated (max 30), e.g. rocket, coffee, shield"
        required: true
permissions:
  contents: write
  actions: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate
        env:
          WORDS: ${{ inputs.words }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate-icons.mjs "$WORDS"
      - name: Commit and redeploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/icons.json
          if git diff --cached --quiet; then echo "No new icons."; exit 0; fi
          git commit -m "Add AI-generated icons"
          git push
          gh workflow run pages.yml
